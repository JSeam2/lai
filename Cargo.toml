[package]
name = "lai"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
env_logger = "0.11"
indicatif = "0.18"

log = "0.4"

clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
dotenvy = "0.15"
rpassword = "7"
serde_json = "1"
tempfile = "3"
tiny_http = "0.12"
toml_edit = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
safemlx = { version = "0.1.3", features = ["safetensors"] }
safemlx-lm = "0.4.1"
libc = "0.2"
